name: Build and Release RaceMind

on:
  push:
    branches: ['main']
  workflow_dispatch:

permissions:
  contents: write

jobs:
  windows-release:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '8.0.x'

      - name: Read app version
        id: version
        shell: pwsh
        run: |
          [xml]$project = Get-Content 'src/RaceMind/RaceMind.csproj'
          $version = [string]$project.Project.PropertyGroup.Version
          if ([string]::IsNullOrWhiteSpace($version)) { throw 'Version missing from RaceMind.csproj' }
          "version=$version" >> $env:GITHUB_OUTPUT
          "tag=v$version" >> $env:GITHUB_OUTPUT

      - name: Check whether release already exists
        id: release
        shell: pwsh
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh release view "${{ steps.version.outputs.tag }}" --repo "${{ github.repository }}" *> $null
          if ($LASTEXITCODE -eq 0) { "publish=false" >> $env:GITHUB_OUTPUT } else { "publish=true" >> $env:GITHUB_OUTPUT }
          exit 0

      - name: Restore official RaceMind brand assets
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force -Path src/RaceMind/Assets | Out-Null
          [IO.File]::WriteAllBytes('src/RaceMind/Assets/racemind-logo.png', [Convert]::FromBase64String((Get-Content 'src/RaceMind/AssetsEncoded/racemind-logo.png.b64' -Raw)))
          $png = [IO.File]::ReadAllBytes('src/RaceMind/Assets/racemind-logo.png')
          $header = New-Object byte[] 22
          $header[0]=0; $header[1]=0; $header[2]=1; $header[3]=0; $header[4]=1; $header[5]=0
          $header[6]=0; $header[7]=0; $header[8]=0; $header[9]=0; $header[10]=1; $header[11]=0; $header[12]=32; $header[13]=0
          [BitConverter]::GetBytes([int]$png.Length).CopyTo($header,14)
          [BitConverter]::GetBytes([int]22).CopyTo($header,18)
          [IO.File]::WriteAllBytes('src/RaceMind/Assets/racemind.ico', $header + $png)

      - name: Restore
        run: dotnet restore src/RaceMind/RaceMind.csproj

      - name: Publish Windows x64
        run: dotnet publish src/RaceMind/RaceMind.csproj -c Release -r win-x64 --self-contained true -o publish

      - name: Install Velopack CLI
        if: steps.release.outputs.publish == 'true'
        run: dotnet tool install -g vpk --version 1.2.0

      - name: Download previous update feed
        if: steps.release.outputs.publish == 'true'
        shell: pwsh
        run: |
          vpk download github --repoUrl "https://github.com/${{ github.repository }}" --token "${{ secrets.GITHUB_TOKEN }}" || exit 0

      - name: Package installer and update feed
        if: steps.release.outputs.publish == 'true'
        shell: pwsh
        run: |
          vpk pack --packId RaceMind --packVersion "${{ steps.version.outputs.version }}" --packDir publish --mainExe RaceMind.exe --icon src/RaceMind/Assets/racemind.ico --packTitle RaceMind --instLocation PerUser

      - name: Publish GitHub Release
        if: steps.release.outputs.publish == 'true'
        shell: pwsh
        run: |
          vpk upload github --repoUrl "https://github.com/${{ github.repository }}" --publish --releaseName "RaceMind ${{ steps.version.outputs.version }}" --tag "${{ steps.version.outputs.tag }}" --targetCommitish "${{ github.sha }}" --token "${{ secrets.GITHUB_TOKEN }}"

      - name: Upload installer artifact
        if: steps.release.outputs.publish == 'true'
        uses: actions/upload-artifact@v4
        with:
          name: RaceMind-${{ steps.version.outputs.version }}-Windows
          path: Releases/**
